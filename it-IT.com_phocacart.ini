COM_PHOCACART_SAME_DELIVERY_BILLING_ADDRESS_INFLUENCE_RULES_DESC="Se un cliente imposta l'indirizzo di consegna in Phoca Cart in modo che corrisponda all'indirizzo di fatturazione per un ordine specifico, ciò non significa che l'indirizzo di consegna esistente verrà eliminato dal sistema. Verrà comunque conservato, ma non sarà più valido per quell'ordine specifico. Ciò potrebbe influire sulle regole di spedizione o di pagamento. <ul><li>Se è impostato 'No' e il cliente verifica che l'indirizzo di consegna e di fatturazione siano gli stessi, le regole del metodo di spedizione o di pagamento verranno autenticate in base alle informazioni impostate nell'account del cliente.</li><li>Se è impostato 'Sì (stessi valori)' e il cliente verifica che l'indirizzo di consegna e di fatturazione siano gli stessi, le regole del metodo di spedizione o di pagamento interpreteranno questo come se il paese, la regione o il CAP dell'indirizzo di consegna fossero gli stessi dell'indirizzo di fatturazione.</li><li>Se è impostato 'Sì (valori vuoti)' e il cliente verifica che l'indirizzo di consegna e di fatturazione siano gli stessi, le regole del metodo di spedizione o di pagamento interpreteranno questo come se il paese, la regione o il CAP dell'indirizzo di consegna non fossero stati impostati.</li></ul>Questo parametro influisce sulle regole <b>Paese</b>, <b>Regione</b> <b>Zona</b> e <b>CAP</b>."
