COM_PHOCACART_FIELD_FEED_DISPLAY_ATTRIBUTES_DESC="Mostra o nascondi gli attributi (opzioni come colore, dimensione,...) in XML Feed. Attenzione: la visualizzazione degli attributi può richiedere molte risorse di memoria. Se ci sono molti prodotti con un gran numero di attributi e opzioni, non è consigliabile rendere gli attributi visibili in XML Feed (a causa dei problemi di tempo e di memoria). Se abilitato, prima della pubblicazione del XML Feed verificare la forma di visualizzazione degli attributi. Potrebbe essere diverso per ogni XML feed. In tal caso l'output deve essere personalizzato."
